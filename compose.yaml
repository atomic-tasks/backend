name: atomic-tasks

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES__USER:-atomic_tasks}
      POSTGRES_PASSWORD: ${POSTGRES__PASSWORD:-atomic_tasks}
      POSTGRES_DB: ${POSTGRES__DB:-atomic_tasks}
      RAUTHY_DB_PASSWORD: ${RAUTHY_DB_PASSWORD:?задайте RAUTHY_DB_PASSWORD в .env}
    ports:
      - "5432:5432"
    volumes:
      # в образе Postgres 18 данные лежат в /var/lib/postgresql/18/docker
      - postgres-data:/var/lib/postgresql
      # база и роль для Rauthy; скрипт выполняется только на пустом томе
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  rauthy:
    image: ghcr.io/sebadob/rauthy:0.37.2
    environment:
      BOOTSTRAP_ADMIN_EMAIL: ${RAUTHY_ADMIN_EMAIL:-admin@localhost}
      PG_PASSWORD: ${RAUTHY_DB_PASSWORD}
      ENC_KEYS: ${RAUTHY_ENC_KEYS:?задайте RAUTHY_ENC_KEYS в .env}
      ENC_KEY_ACTIVE: ${RAUTHY_ENC_KEY_ACTIVE:?задайте RAUTHY_ENC_KEY_ACTIVE в .env}
      HQL_SECRET_RAFT: ${RAUTHY_HQL_SECRET_RAFT:?задайте RAUTHY_HQL_SECRET_RAFT в .env}
      HQL_SECRET_API: ${RAUTHY_HQL_SECRET_API:?задайте RAUTHY_HQL_SECRET_API в .env}
      # RFC 8252: redirect на localhost/127.0.0.1 совпадает при любом порту. Claude Code слушает callback
      # на случайном порту, а в его CIMD-документе адрес без порта (спека 0007).
      RFC_8252_ENABLE: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./docker/rauthy/config.toml:/app/config.toml:ro
      - rauthy-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES__HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES__HOST: postgres
      # issuer в токенах — http://localhost:8080/auth/v1, а из контейнера Rauthy доступен по имени сервиса
      AUTH__INTERNAL_URL: http://rauthy:8080
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
  rauthy-data:
